[workspace]
resolver = "3"
members = ["crates/curseterm", "crates/barrier-kit-next"]
exclude = ["target"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/HBlanqueto/curseterm"

[workspace.dependencies]
barrier-kit = { git = "https://github.com/HBlanqueto/barrierkit", rev = "ba58ce01ef1f8e07dd915f783290b6ef068c037a" }
vow-design = { git = "https://github.com/HBlanqueto/barrierkit", rev = "ba58ce01ef1f8e07dd915f783290b6ef068c037a" }
vow-appearance = { git = "https://github.com/HBlanqueto/barrierkit", rev = "ba58ce01ef1f8e07dd915f783290b6ef068c037a" }
barrier-kit-next = { path = "crates/barrier-kit-next" }

freya-core = "=0.4.3"
freya-engine = "=0.4.3"
freya-clipboard = "=0.4.3"
torin = "=0.4.3"

alacritty_terminal = "0.26"

toml = "0.8"
rustix = { version = "1", features = ["process", "event"] }
base64 = "0.22"
plist = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
