[workspace]
resolver = "3"
members = ["crates/curseterm"]
exclude = ["target"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/HBlanqueto/curseterm"

[workspace.dependencies]
barrier-kit = { git = "https://github.com/HBlanqueto/barrierkit", rev = "4e23c81353c68ec4da3333459b41d19eee7dd254" }
vow-design = { git = "https://github.com/HBlanqueto/barrierkit", rev = "4e23c81353c68ec4da3333459b41d19eee7dd254" }
vow-appearance = { git = "https://github.com/HBlanqueto/barrierkit", rev = "4e23c81353c68ec4da3333459b41d19eee7dd254" }

freya-core = "=0.4.3"
freya-engine = "=0.4.3"
freya-clipboard = "=0.4.3"
torin = "=0.4.3"

alacritty_terminal = "0.26"

toml = "0.8"
rustix = { version = "1", features = ["process", "event", "termios"] }
base64 = "0.22"
libc = "0.2"
regex = "1"
plist = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
zeroize = "1"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
